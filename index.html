<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cá Voi Đang Bơi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b1d3a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Khung cảnh đại dương */
    .ocean {
      position: relative;
      width: 400px;
      height: 400px;
      background: linear-gradient(to bottom, #102a45 0%, #081225 100%);
      border-radius: 50%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      border: 4px solid #1a3c61;
    }

    /* Container chứa cá voi để tạo chuyển động bơi nhấp nhô */
    .whale-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: swim 4s ease-in-out infinite;
    }

    /* Thân cá voi */
    .whale {
      position: relative;
      width: 180px;
      height: 90px;
      background-color: #2b7a9e;
      border-radius: 80px 90px 40px 50px;
    }

    /* Bụng cá voi */
    .whale::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 20px;
      width: 120px;
      height: 40px;
      background-color: #eaf4f8;
      border-radius: 0 0 40px 50px;
    }

    /* Mắt */
    .eye {
      position: absolute;
      top: 30px;
      right: 40px;
      width: 10px;
      height: 10px;
      background-color: #0d2137;
      border-radius: 50%;
      z-index: 2;
    }
    .eye::after {
      content: '';
      position: absolute;
      top: 2px;
      right: 2px;
      width: 3px;
      height: 3px;
      background-color: #fff;
      border-radius: 50%;
    }

    /* Vây bên hông */
    .fin {
      position: absolute;
      top: 50px;
      right: 70px;
      width: 35px;
      height: 18px;
      background-color: #1e5a75;
      border-radius: 10px 10px 30px 30px;
      transform: rotate(-20deg);
      transform-origin: top right;
      animation: flap 2s ease-in-out infinite;
      z-index: 3;
    }

    /* Đuôi cá */
    .tail {
      position: absolute;
      top: 25px;
      left: -25px;
      width: 40px;
      height: 25px;
      background-color: #2b7a9e;
      clip-path: polygon(100% 50%, 0 0, 15% 50%, 0 100%);
      transform-origin: right center;
      animation: wag 1.5s ease-in-out infinite;
    }

    /* Cột nước phun lên */
    .spout {
      position: absolute;
      top: -35px;
      right: 50px;
      width: 6px;
      height: 35px;
      background: linear-gradient(to top, rgba(255,255,255,0.8), rgba(255,255,255,0.1));
      border-radius: 3px;
      animation: spout 2s ease-in-out infinite;
    }

    /* Bong bóng nước */
    .bubble {
      position: absolute;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      animation: rise 3s infinite ease-in;
    }
    .b1 { width: 12px; height: 12px; left: 60px; bottom: 20px; animation-duration: 4s; }
    .b2 { width: 8px; height: 8px; left: 120px; bottom: 10px; animation-duration: 3.2s; animation-delay: 1s; }
    .b3 { width: 16px; height: 16px; left: 280px; bottom: 30px; animation-duration: 5s; animation-delay: 0.5s; }

    /* Hiệu ứng chuyển động (Animations) */
    @keyframes swim {
      0%, 100% { transform: translate(-50%, -45%) rotate(0deg); }
      50% { transform: translate(-50%, -55%) rotate(-4deg); }
    }

    @keyframes wag {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(15deg); }
    }

    @keyframes flap {
      0%, 100% { transform: rotate(-20deg); }
      50% { transform: rotate(5deg); }
    }

    @keyframes spout {
      0%, 100% { height: 0; opacity: 0; }
      50% { height: 35px; opacity: 0.9; }
    }

    @keyframes rise {
      0% { transform: translateY(0); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(-300px); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="ocean">
    <!-- Bong bóng -->
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>

    <!-- Cá voi -->
    <div class="whale-container">
      <div class="spout"></div>
      <div class="whale">
        <div class="eye"></div>
        <div class="fin"></div>
        <div class="tail"></div>
      </div>
    </div>
  </div>

</body>
</html>
